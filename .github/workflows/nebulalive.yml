name: NebulaLive Cloud Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nebulalive-worker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Maçları kontrol et (~4.5 dakika, 15sn aralıklarla)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python cloud_runner.py

      - name: Durumu (dedup DB) commit'le
        run: |
          git config user.name "nebulalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nebulalive.db
          git diff --staged --quiet || git commit -m "state güncelle [skip ci]"
          git push
