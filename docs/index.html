<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NebulaLive — Canlı Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%237c3aed'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #05040a;
    --bg-1: #0b0818;
    --panel: #100c1e;
    --panel-2: #150f26;
    --border: #241a3d;
    --text-0: #f1edfb;
    --text-1: #a89bd1;
    --text-2: #6e6291;
    --accent: #a78bfa;
    --accent-2: #22d3ee;
    --live: #34d399;
    --warn: #fbbf24;
    --err: #fb7185;
    --goal: #f472b6;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-0);
    color: var(--text-0);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100%;
  }

  body {
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(124,58,237,0.35), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(34,211,238,0.18), transparent 55%),
      radial-gradient(ellipse 800px 600px at 50% 120%, rgba(244,114,182,0.10), transparent 60%),
      var(--bg-0);
    background-attachment: fixed;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand .orb {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d8b4fe, var(--accent) 45%, #4c1d95 100%);
    box-shadow: 0 0 24px rgba(167,139,250,0.6);
    flex-shrink: 0;
  }

  .brand h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.3px;
    margin: 0;
  }

  .brand span.sub {
    display: block;
    font-size: 11px;
    color: var(--text-2);
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .badges {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-1);
  }

  .badge.live { color: var(--live); border-color: rgba(52,211,153,0.35); background: rgba(52,211,153,0.08); }
  .badge.test { color: var(--warn); border-color: rgba(251,191,36,0.35); background: rgba(251,191,36,0.08); }
  .badge.on-air { color: var(--goal); border-color: rgba(244,114,182,0.4); background: rgba(244,114,182,0.1); }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.75); }
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }

  .stat .k {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-2);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .stat .v {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-0);
    font-variant-numeric: tabular-nums;
  }

  .grid {
    display: grid;
    grid-template-columns: 1.1fr 1.4fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-1);
    font-weight: 600;
    margin: 0;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .matches { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .match-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .match-card .teams {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 8px;
  }

  .match-card .teams .vs { color: var(--text-2); font-weight: 500; padding: 0 8px; font-size: 12px; }

  .match-card .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
  }

  .match-card .mid {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 60%;
  }

  .pill {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 999px;
  }

  .pill.active { color: var(--live); background: rgba(52,211,153,0.12); }
  .pill.inactive { color: var(--text-2); background: rgba(255,255,255,0.05); }

  .empty {
    padding: 30px 18px;
    text-align: center;
    color: var(--text-2);
    font-size: 13px;
  }

  .log {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.7;
    padding: 14px 18px;
    max-height: 480px;
    overflow-y: auto;
    display: flex;
    flex-direction: column-reverse;
  }

  .log-line { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.04); }
  .log-line .t { color: var(--text-2); flex-shrink: 0; }
  .log-line .m { color: var(--text-1); word-break: break-word; }
  .log-line.lvl-info .m { color: var(--text-1); }
  .log-line.lvl-warn .m { color: var(--warn); }
  .log-line.lvl-error .m { color: var(--err); }
  .log-line.lvl-goal .m { color: var(--goal); font-weight: 600; }
  .log-line.lvl-success .m { color: var(--live); font-weight: 600; }

  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  footer {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    color: var(--text-2);
  }

  footer a { color: var(--accent-2); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  .loading-msg, .error-msg {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-2);
    font-size: 13px;
  }
  .error-msg { color: var(--err); }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="orb"></div>
        <div>
          <h1>NebulaLive</h1>
          <span class="sub">Gol Otomasyonu — Kontrol Paneli</span>
        </div>
      </div>
      <div class="badges" id="badges">
        <span class="badge live"><span class="dot"></span>YÜKLENİYOR</span>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <div class="grid">
      <div class="panel">
        <h2>İzlenen Maçlar <span id="match-count"></span></h2>
        <div class="matches" id="matches">
          <div class="loading-msg">Yükleniyor…</div>
        </div>
      </div>

      <div class="panel">
        <h2>Canlı Kayıt</h2>
        <div class="log" id="log">
          <div class="loading-msg">Yükleniyor…</div>
        </div>
      </div>
    </div>

    <footer>
      Bu panel GitHub Actions üzerinde 7/24 çalışan bir otomasyonun durumunu gösterir.
      Veri her ~5 dakikada bir güncellenir · <a href="https://github.com/FarukOz1/task-runner-svc" target="_blank" rel="noopener">kaynak kod</a>
    </footer>
  </div>

<script>
  const STATUS_URL = "https://raw.githubusercontent.com/FarukOz1/task-runner-svc/main/status.json";
  const REFRESH_MS = 20000;

  function timeAgo(iso) {
    const diff = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (diff < 60) return Math.floor(diff) + " sn önce";
    if (diff < 3600) return Math.floor(diff / 60) + " dk önce";
    return Math.floor(diff / 3600) + " sa önce";
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function renderBadges(status, stale) {
    const el = document.getElementById('badges');
    let html = '';
    if (stale) {
      html += `<span class="badge test"><span class="dot"></span>BAĞLANTI YOK</span>`;
    } else {
      html += `<span class="badge live"><span class="dot"></span>LIVE</span>`;
      html += status.dry_run
        ? `<span class="badge test">TEST MODU</span>`
        : `<span class="badge on-air">CANLI PAYLAŞIM</span>`;
    }
    el.innerHTML = html;
  }

  function renderStats(status) {
    const activeCount = status.watchlist.filter(m => m.active).length;
    const items = [
      ["Son Güncelleme", timeAgo(status.last_updated)],
      ["Kontrol Aralığı", status.poll_interval_seconds + " sn"],
      ["Bu Turda Kontrol", status.poll_count + " kez"],
      ["Aktif Maç", activeCount],
    ];
    document.getElementById('stats').innerHTML = items.map(([k, v]) =>
      `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`
    ).join('');
  }

  function renderMatches(status) {
    const el = document.getElementById('matches');
    document.getElementById('match-count').textContent = `(${status.watchlist.length})`;
    if (!status.watchlist.length) {
      el.innerHTML = '<div class="empty">Watchlist boş.</div>';
      return;
    }
    el.innerHTML = status.watchlist.map(m => `
      <div class="match-card">
        <div class="teams">
          <span>${escapeHtml(m.home)}</span>
          <span class="vs">vs</span>
          <span>${escapeHtml(m.away)}</span>
        </div>
        <div class="meta">
          <span class="mid">${escapeHtml(m.match_id)}</span>
          <span class="pill ${m.active ? 'active' : 'inactive'}">${m.active ? 'İzleniyor' : 'Pasif'}</span>
        </div>
      </div>
    `).join('');
  }

  function renderLog(status) {
    const el = document.getElementById('log');
    if (!status.recent_log.length) {
      el.innerHTML = '<div class="empty">Henüz kayıt yok.</div>';
      return;
    }
    el.innerHTML = status.recent_log.map(entry => `
      <div class="log-line lvl-${entry.level}">
        <span class="t">${fmtTime(entry.time)}</span>
        <span class="m">${escapeHtml(entry.message)}</span>
      </div>
    `).join('');
  }

  async function refresh() {
    try {
      const res = await fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const status = await res.json();
      renderBadges(status, false);
      renderStats(status);
      renderMatches(status);
      renderLog(status);
    } catch (e) {
      renderBadges({}, true);
      document.getElementById('matches').innerHTML = `<div class="error-msg">Veri alınamadı: ${escapeHtml(e.message)}</div>`;
      document.getElementById('log').innerHTML = `<div class="error-msg">Veri alınamadı.</div>`;
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
